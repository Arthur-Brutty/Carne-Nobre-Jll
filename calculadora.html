<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Monte seu churrasco | Carne Nobre</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>

<body>
  <header>
    <nav aria-label="Navegação principal">
      <a href="index.html">Carne Nobre</a>

      <div>
        <a href="index.html">Início</a>
        <a href="cardapio.html">Cardápio</a>
        <a href="calculadora.html">Monte seu churrasco</a>
        <a href="contato.html">Contato</a>
      </div>
    </nav>
  </header>

  <main>
    <section>
        <h1>Monte seu churrasco</h1>

        <form id="form-churrasco" novalidate>
            <p>
                <label for="peso">Quantos quilos de carne você precisa?</label>
                <input type="number" id="peso" name="peso" min="0.001" step="0.001" required>
            </p>
            <p>
                <label for="preco">Preço por quilo (R$):</label>
                <input type="number" id="preco" name="preco" min="0" step="0.01" required>
            </p>
            
            <button type="submit">calcular total</button>
        </form>

        <p id="resultado" role="status"></p>
    </section>
  </main>

  <footer>
    <p>Carne Nobre Joinville</p>
  </footer>
</body>
</html>
